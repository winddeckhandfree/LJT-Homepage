name: Test Jekyll Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify generated content
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          for p in synlogic perception-bottleneck-vlms universal-truthfulness-hyperplane in-context-sharpness c-eval composing-parameter-efficient-modules; do test -f "_site/publication/$p/index.html"; done
          grep -q "Junteng Liu" _site/index.html
          grep -q "SynLogic" _site/index.html
          grep -q "SynLogic" _site/publications/index.html
          grep -q "C-Eval" _site/publications/index.html
          echo "All content checks passed"
